name: Pages

# Publishes site/ with the README's images to GitHub Pages (openhonu.ai).
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a deployment in progress finish rather than cancel it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Put the page and its images together
        run: |
          mkdir -p _site/images
          cp site/index.html _site/
          cp docs/images/* _site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
