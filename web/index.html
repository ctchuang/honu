<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fill the screen and keep pinch-zoom from fighting with dragging bubbles. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Honu</title>
  <link data-trunk rel="rust" href="../Cargo.toml" data-wasm-opt="2">
  <link data-trunk rel="icon" href="../assets/icon.png">
  <link data-trunk rel="copy-file" href="../assets/icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #dee4f0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      /* Hand touches to egui instead of scrolling or zooming the page. */
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="honu"></canvas>
</body>
</html>
